name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
      - name: Fresh computer without Node (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TENCENT_DOCS_FORCE_PORTABLE_NODE: '1'
          TENCENT_DOCS_RUNTIME_DIR: ${{ runner.temp }}/tencent-docs-node
        run: |
          bash scripts/bootstrap.sh --help
          bash scripts/bootstrap.sh --help
      - name: Fresh computer without Node (Windows PowerShell 5)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TENCENT_DOCS_FORCE_PORTABLE_NODE: '1'
          TENCENT_DOCS_RUNTIME_DIR: ${{ runner.temp }}/tencent-docs-node
        run: |
          # Remove preinstalled Node from PATH to exercise a fresh Windows PC.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the actual double-click launcher too; EOF dismisses its pause.
          cmd.exe /d /c "setup.cmd --help <nul"
          exit $LASTEXITCODE
